name: KLIPEK TV - Fast HLS Remux

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  build-hls:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests huggingface_hub

      - name: Check tools
        run: |
          ffmpeg -version
          ffprobe -version
          python3 -c "import huggingface_hub; print(huggingface_hub.__version__)"

      - name: Build and upload fast HLS
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: androjid21/klippek
          HLS_SEGMENT_SECONDS: "6"
        run: |
          python3 build_hls.py
